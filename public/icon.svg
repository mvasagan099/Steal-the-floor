<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tile-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="char" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Isometric Floating Tile Base -->
  <g filter="url(#shadow)">
    <!-- Tile 3D Side -->
    <path d="M96 340 L256 420 L416 340 L416 370 L256 450 L96 370 Z" fill="url(#tile-side)"/>
    <!-- Tile Top Face -->
    <polygon points="256,260 416,340 256,420 96,340" fill="url(#tile)"/>
    <!-- Highlight Edge -->
    <polyline points="96,340 256,260 416,340" stroke="#7dd3fc" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Mascot Shadow -->
  <ellipse cx="256" cy="335" rx="55" ry="22" fill="#0369a1" opacity="0.6"/>
  
  <!-- Mascot Character -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <circle cx="256" cy="235" r="95" fill="url(#char)"/>
    
    <!-- Blush -->
    <circle cx="205" cy="255" r="16" fill="#f87171" opacity="0.4"/>
    <circle cx="307" cy="255" r="16" fill="#f87171" opacity="0.4"/>
    
    <!-- Eyes -->
    <circle cx="218" cy="225" r="14" fill="#1e293b"/>
    <circle cx="294" cy="225" r="14" fill="#1e293b"/>
    <circle cx="223" cy="220" r="5" fill="#ffffff"/>
    <circle cx="299" cy="220" r="5" fill="#ffffff"/>
    
    <!-- Smile -->
    <path d="M 238 250 Q 256 268 274 250" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Cute Antenna / Floating Crown -->
    <path d="M 256 140 Q 256 115 256 100" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="95" r="12" fill="#38bdf8"/>
  </g>
</svg>
